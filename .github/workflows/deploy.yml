name: Deploy .NET 8 Web API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Create appsettings.Production.json for build
      env:
        APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
      run: |
        printf '%s' "$APPSETTINGS_PRODUCTION" > RikiPath.WebApi/appsettings.Production.json

    - name: Publish Web API
      run: dotnet publish RikiPath.WebApi/RikiPath.WebApi.csproj -c Release -o ./publish

    - name: Create appsettings.Production.json in publish
      env:
        APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
      run: |
        printf '%s' "$APPSETTINGS_PRODUCTION" > ./publish/appsettings.Production.json

    - name: Transfer files to VPS
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "publish/*"
        target: "/var/www/rikipath-api"
        strip_components: 1
        rm: false

    - name: Restart Systemd Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          chmod 600 /var/www/rikipath-api/appsettings.Production.json
          systemctl restart rikipath-api.service