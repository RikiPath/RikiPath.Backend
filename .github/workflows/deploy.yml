name: Deploy .NET 8 Web API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      allow_db_migration:
        description: "Explicitly authorize applying pending EF migrations after verified backup"
        required: false
        default: false
        type: boolean
      backup_verified:
        description: "Set true only if an external/managed PostgreSQL backup snapshot is already verified"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore & Build Solution (Release)
      run: |
        dotnet restore RikiPath.Backend.slnx
        dotnet build RikiPath.Backend.slnx --no-restore -c Release

    - name: Install EF Core CLI & Verify Migration Snapshot Integrity
      shell: pwsh
      run: |
        dotnet tool install --global dotnet-ef --version 8.0.8
        ./tools/verify-migration-readiness.ps1 -SkipDatabaseCheck -NoBuild -BuildConfiguration Release

    - name: Generate Ordered Per-Migration SQL Package
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./release-migrations
        cp ./tools/apply-release-migrations.sh ./release-migrations/apply-release-migrations.sh
        chmod +x ./release-migrations/apply-release-migrations.sh

        mapfile -t MIGRATIONS < <(
          dotnet ef migrations list \
            --project RikiPath.Infrastructure \
            --startup-project RikiPath.WebApi \
            --no-build \
            --configuration Release \
            --no-connect \
            -- --no-connect | grep -E '^[0-9]{14}_[A-Za-z0-9_]+$'
        )

        if [[ ${#MIGRATIONS[@]} -eq 0 ]]; then
          echo "ERROR: No EF migrations discovered." >&2
          exit 1
        fi

        printf '%s\n' "${MIGRATIONS[@]}" > ./release-migrations/manifest.txt

        PREV="0"
        for MIG in "${MIGRATIONS[@]}"; do
          dotnet ef migrations script "$PREV" "$MIG" \
            --project RikiPath.Infrastructure \
            --startup-project RikiPath.WebApi \
            --no-build \
            --configuration Release \
            --output "./release-migrations/${MIG}.sql" \
            -- --no-connect
          PREV="$MIG"
        done

    - name: Create appsettings.Production.json for build
      env:
        APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
      run: |
        printf '%s' "$APPSETTINGS_PRODUCTION" > RikiPath.WebApi/appsettings.Production.json

    - name: Publish Web API
      run: dotnet publish RikiPath.WebApi/RikiPath.WebApi.csproj -c Release -o ./publish

    - name: Create appsettings.Production.json in publish
      env:
        APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}
      run: |
        printf '%s' "$APPSETTINGS_PRODUCTION" > ./publish/appsettings.Production.json

    - name: Stage Migration Package on VPS (Before Binary Deployment)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "release-migrations/*"
        target: "/tmp/rikipath-release-migrations"
        strip_components: 1
        rm: true

    - name: Database Preflight, Backup Verification & Ordered Migration Gate
      uses: appleboy/ssh-action@v1.0.3
      env:
        RIKIPATH_ALLOW_DB_MIGRATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_db_migration) || vars.RIKIPATH_ALLOW_DB_MIGRATION == 'true' }}
        RIKIPATH_BACKUP_VERIFIED: ${{ (github.event_name == 'workflow_dispatch' && inputs.backup_verified) || vars.RIKIPATH_BACKUP_VERIFIED == 'true' }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        envs: RIKIPATH_ALLOW_DB_MIGRATION,RIKIPATH_BACKUP_VERIFIED
        script: |
          set -euo pipefail
          chmod +x /tmp/rikipath-release-migrations/apply-release-migrations.sh
          MODE="preflight"
          if [[ "${RIKIPATH_ALLOW_DB_MIGRATION:-false}" == "true" ]]; then
            MODE="apply"
          fi
          /tmp/rikipath-release-migrations/apply-release-migrations.sh \
            --appsettings /var/www/rikipath-api/appsettings.Production.json \
            --migrations-dir /tmp/rikipath-release-migrations \
            --mode "$MODE"

    - name: Snapshot Current Running API Binaries for Automatic Rollback
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          set -euo pipefail
          mkdir -p /var/backups/rikipath-api
          chmod 700 /var/backups/rikipath-api
          rm -rf /var/backups/rikipath-api/previous
          if [[ -d /var/www/rikipath-api ]]; then
            cp -a /var/www/rikipath-api /var/backups/rikipath-api/previous
            chmod 600 /var/backups/rikipath-api/previous/appsettings.Production.json 2>/dev/null || true
          fi

    - name: Transfer Published API to VPS (Only After Migration Gate Passes)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "publish/*"
        target: "/var/www/rikipath-api"
        strip_components: 1
        rm: false

    - name: Restart Service, Verify /health/ready & Auto-Rollback Binary on Failure
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          set -euo pipefail
          chmod 600 /var/www/rikipath-api/appsettings.Production.json
          systemctl restart rikipath-api.service
          rm -rf /tmp/rikipath-release-migrations

          LOCAL_URL="$(systemctl cat rikipath-api.service 2>/dev/null | grep -oE 'http://(127\.0\.0\.1|localhost|0\.0\.0\.0):[0-9]+' | head -n 1 | sed 's/0\.0\.0\.0/127.0.0.1/' || true)"
          if [[ -z "$LOCAL_URL" ]]; then
            LOCAL_URL="http://127.0.0.1:5000"
          fi

          rollback_previous_binary() {
            echo "WARNING: New Backend failed verification; restoring previous API binaries from /var/backups/rikipath-api/previous ..." >&2
            if [[ -d /var/backups/rikipath-api/previous ]]; then
              rm -rf /var/www/rikipath-api/*
              cp -a /var/backups/rikipath-api/previous/. /var/www/rikipath-api/
              chmod 600 /var/www/rikipath-api/appsettings.Production.json 2>/dev/null || true
              systemctl restart rikipath-api.service || true
              echo "Previous API binaries restored and service restarted. Inspect journalctl -u rikipath-api.service." >&2
            else
              echo "ERROR: No previous binary snapshot available for automatic rollback." >&2
            fi
          }

          READY_OK=false
          for i in $(seq 1 15); do
            HTTP_CODE="$(curl -s -o /tmp/rikipath-ready.json -w '%{http_code}' "${LOCAL_URL}/health/ready" || echo 000)"
            if [[ "$HTTP_CODE" == "200" ]] && grep -q '"Ready"' /tmp/rikipath-ready.json; then
              READY_OK=true
              break
            fi
            sleep 2
          done

          if [[ "$READY_OK" != "true" ]]; then
            echo "ERROR: /health/ready did not return 200 Ready after service restart." >&2
            cat /tmp/rikipath-ready.json 2>/dev/null || true
            rm -f /tmp/rikipath-ready.json
            rollback_previous_binary
            exit 1
          fi
          rm -f /tmp/rikipath-ready.json

          # Unauthenticated route registration smoke check (401/403 proves route is mounted; full auth contract requires operator verification).
          for ROUTE in \
            "/api/UserProfile/me/setup-state" \
            "/api/MockTest/history/paged" \
            "/api/admin/mentor-group-policies/levels" \
            "/api/subscriptions/history"; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "${LOCAL_URL}${ROUTE}" || echo 000)"
            echo "  Route registration check ${ROUTE} -> HTTP ${CODE}"
            if [[ "$CODE" == "404" || "$CODE" == "000" || "$CODE" =~ ^5 ]]; then
              echo "ERROR: Critical route ${ROUTE} failed registration check (HTTP ${CODE})." >&2
              rollback_previous_binary
              exit 1
            fi
          done
          echo "Deployment verified: /health/ready=Ready and new API routes registered."
